# Configuration générale d'AmethyysNPCs
script-default-interval: 20
script-approach-radius: 3.0
script-npc-approach-radius: 3.0
# Durée pendant laquelle npc is under attack reste vrai après le dernier dégât.
script-under-attack-duration-ticks: 100
tracking-range: 64
selector-range: 64
movement:
  update-ticks: 1
  default-speed: 4.0
  checkpoint-spacing: 2.0
  pathfinding:
    enabled: true
    max-nodes: 5000
    max-distance: 128.0
  flying:
    max-nodes: 5000
    max-distance: 128.0
  climbing:
    max-nodes: 5000
    max-distance: 96.0
  swimming:
    max-nodes: 5000
    max-distance: 96.0
  amphibious:
    max-nodes: 8000
    max-distance: 128.0
