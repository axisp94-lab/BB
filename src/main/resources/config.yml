# Configuration générale d'AmethyysNPCs
script-default-interval: 20
script-approach-radius: 3.0
script-warning-permission: "anpc.script.warning"
tracking-range: 64
movement:
  update-ticks: 1
  default-speed: 4.0
  checkpoint-spacing: 2.0
  max-path-attempts: 100

combat:
  target-range: 24.0
  attack-range: 2.5
  damage: 2.0
  cooldown-ticks: 20
